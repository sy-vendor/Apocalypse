[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-src"
version = "0.1.0"
description = "Scope-safe web security checks and report generation for authorized SRC programs"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]

[project.scripts]
sentinel-src = "sentinel_src.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

