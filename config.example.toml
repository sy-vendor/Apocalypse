[scope]
allow_hosts = ["example.com", "*.example.com"]
deny_hosts = ["admin.example.com"]
allow_http = false

[scan]
automation_allowed = true
# 可选：按项目规则禁止特定当地时段执行批量扫描、watch 和 authz-compare。
# automation_timezone = "Asia/Shanghai"
# blocked_bulk_hours = [9, 21]
requests_per_second = 2.0
concurrency = 4
timeout_seconds = 10.0
max_body_bytes = 65536
user_agent = "Sentinel-SRC/0.1 (authorized security testing)"
# 可按项目规则过滤明确不接收的检查结果；值必须使用 finding 的 id。
excluded_finding_ids = []
crawl_enabled = true
max_crawl_pages = 10
max_crawl_depth = 1
max_discovered_urls = 100

