# 仅转录用户截图中可见的资产范围，不代表完整或当前有效的官方范围。
# 使用前必须在联想 SRC 官方页面逐项核对，并删除不确定的条目。
[scope]
allow_hosts = [
  "*.lenovo.com",
  "*.lenovo.com.cn",
  "*.lenovomm.com",
  "*.lenovo.cn",
  "*.lenovo.net",
  "*.motorola.com",
  "*.motorola.com.cn",
  "*.baiying.cn",
]
deny_hosts = ["*.sunits.com"]
allow_http = false

[scan]
requests_per_second = 1.0
concurrency = 2
timeout_seconds = 10.0
max_body_bytes = 65536
user_agent = "Sentinel-SRC/0.1 (authorized Lenovo SRC testing; human review required)"

