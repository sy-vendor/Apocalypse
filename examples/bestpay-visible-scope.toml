# 本配置用于范围校验与规则留档，不可用于自动扫描。
# 资产范围来自用户截图；使用前必须在 YZFSRC 官方页面重新核对。
[scope]
allow_hosts = [
  "*.bestpay.com.cn",
  "*.bestpay.cn",
  "*.bestpay.net",
  "*.tycredit.com",
]
deny_hosts = []
allow_http = false

[scan]
# YZFSRC 截图明确禁止自动化扫描和高频请求。
automation_allowed = false
requests_per_second = 0.1
concurrency = 1
timeout_seconds = 10.0
max_body_bytes = 65536
user_agent = "Sentinel-SRC/0.1 (manual YZFSRC scope validation only)"
crawl_enabled = false
max_crawl_pages = 1
max_crawl_depth = 0
max_discovered_urls = 1
excluded_finding_ids = [
  "cors-wildcard-credentials",
  "missing-strict-transport-security",
  "missing-content-security-policy",
  "missing-x-content-type-options",
  "missing-referrer-policy",
  "missing-permissions-policy",
  "private-address-disclosure",
]

