name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Unit tests and coverage gate
        run: coverage run -m unittest discover -s tests -p 'test_core.py' -v
      - run: coverage report
      - run: coverage xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m playwright install --with-deps chromium
      - name: Browser console smoke test
        env:
          APOCALYPSE_E2E: "1"
        run: python -m unittest discover -s tests -p 'test_e2e.py' -v

  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Deterministic authorized-lab benchmark
        run: python benchmark/run_lab.py --min-recall 1.0 --min-precision 1.0
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-result
          path: benchmark/results/latest.json
